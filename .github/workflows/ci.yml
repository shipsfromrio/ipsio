name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    name: bash -n, shellcheck and script bench (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: for f in *.sh tests/*.sh; do bash -n "$f" || exit 1; done
      - run: shellcheck --version && shellcheck -S warning *.sh tests/*.sh
      - run: bash tests/test-ipsio.sh

  macos:
    name: build and test on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: script bench on macOS bash 3.2
        run: /bin/bash tests/test-ipsio.sh
      - name: build the app, ipsio-calendar and the device creator
        run: |
          swiftc --version
          swiftc -O -parse-as-library app/Schedule.swift app/MacCalendar.swift app/Setup.swift app/SetupWindow.swift app/Consent.swift app/Report.swift app/MeetingDetect.swift app/Search.swift app/SearchWindow.swift app/HotKey.swift app/Engine/*.swift app/Store/*.swift app/Transcribe/*.swift app/Helper/*.swift app/Ipsio.swift -framework AppKit -o "$RUNNER_TEMP/Ipsio"
          swiftc -O -parse-as-library app/Schedule.swift app/MacCalendar.swift app/CalendarCLI.swift -o "$RUNNER_TEMP/ipsio-calendar"
          swiftc -O tools/create-device.swift -o "$RUNNER_TEMP/create-device"
      - name: calendar bench
        run: |
          swiftc -parse-as-library app/Schedule.swift tests/ScheduleTests.swift -o "$RUNNER_TEMP/schedule-tests"
          "$RUNNER_TEMP/schedule-tests"
      - name: setup checklist bench
        run: |
          swiftc -parse-as-library app/Setup.swift tests/SetupTests.swift -o "$RUNNER_TEMP/setup-tests"
          "$RUNNER_TEMP/setup-tests"
      - name: native engine bench
        run: |
          swiftc -parse-as-library app/Engine/*.swift tests/EngineTests.swift -o "$RUNNER_TEMP/engine-tests"
          "$RUNNER_TEMP/engine-tests"
          swiftc -O -parse-as-library app/Engine/*.swift tools/RecCLI.swift -o "$RUNNER_TEMP/ipsio-rec"
      - name: native backend bench (the app's output contract)
        run: |
          swiftc -parse-as-library app/Engine/*.swift app/Setup.swift tests/BackendTests.swift -o "$RUNNER_TEMP/backend-tests"
          "$RUNNER_TEMP/backend-tests"
      - name: capture bench (quality presets, what to record)
        run: |
          swiftc -parse-as-library app/Engine/*.swift tests/CaptureTests.swift -o "$RUNNER_TEMP/capture-tests"
          "$RUNNER_TEMP/capture-tests"
      - name: transcription bench (windows, overlap, speakers, exports)
        run: |
          swiftc -parse-as-library app/Transcribe/*.swift tests/TranscribeTests.swift -o "$RUNNER_TEMP/transcribe-tests"
          "$RUNNER_TEMP/transcribe-tests"
      - name: helper mode bench (cadence, dedup, sides, consent, secrets, the cloud against a fake server)
        run: |
          swiftc -parse-as-library app/Transcribe/Transcript.swift app/Helper/HelperCore.swift app/Helper/HelperTexts.swift app/Helper/HelperCloud.swift tests/HelperTests.swift -o "$RUNNER_TEMP/helper-tests"
          "$RUNNER_TEMP/helper-tests"
      - name: shortcut bench (global hot keys)
        run: |
          swiftc -parse-as-library app/HotKey.swift tests/HotKeyTests.swift -o "$RUNNER_TEMP/hotkey-tests"
          "$RUNNER_TEMP/hotkey-tests"
      - name: meeting detection and search benches
        run: |
          swiftc -parse-as-library app/MeetingDetect.swift tests/MeetingDetectTests.swift -o "$RUNNER_TEMP/detect-tests"
          "$RUNNER_TEMP/detect-tests"
          swiftc -parse-as-library app/Search.swift tests/SearchTests.swift -o "$RUNNER_TEMP/search-tests"
          "$RUNNER_TEMP/search-tests"
      - name: consent reminder bench (when and how to remind, the notice)
        run: |
          swiftc -parse-as-library app/Consent.swift tests/ConsentTests.swift -o "$RUNNER_TEMP/consent-tests"
          "$RUNNER_TEMP/consent-tests"
      - name: integrity report bench (seal, lines, PDF, never touches the recording)
        run: |
          swiftc -parse-as-library app/Report.swift app/Engine/Files.swift tests/ReportTests.swift -o "$RUNNER_TEMP/report-tests"
          "$RUNNER_TEMP/report-tests"
      - name: macOS 13 guard (newer APIs only behind #available)
        run: bash tests/availability.sh
      - name: license bench (trial and lifetime purchase)
        run: |
          swiftc -parse-as-library app/Store/License.swift tests/LicenseTests.swift -o "$RUNNER_TEMP/license-tests"
          "$RUNNER_TEMP/license-tests"
      - name: Mac App Store edition (universal, sandboxed, ad hoc)
        run: bash build-store.sh
      - name: mutants (the benches fail a broken calendar and a broken engine)
        run: bash tests/mutants.sh
